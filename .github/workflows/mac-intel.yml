name: Release Mac Intel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    if: contains(github.event.head_commit.message, '#go')
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
          
      - name: Build Tauri app for Mac Intel
        run: npm run tauri build -- --target x86_64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.CLASSIC_ACCESS_TOKEN }}

      - name: Get version from package.json
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: List build artifacts for debugging
        if: always()
        run: |
          echo "Searching for bundles in target directory:"
          find src-tauri/target/x86_64-apple-darwin/release/bundle -maxdepth 4 -name "*.dmg" -o -name "*.tar.gz"
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Uses v0.1.0 style tags
          tag_name: "v${{ steps.package_version.outputs.APP_VERSION }}"
          fail_on_unmatched_files: false # Set to false to allow partial uploads if one extension is missing
          files: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.app.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.CLASSIC_ACCESS_TOKEN }}