name: Release Mac Intel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    if: contains(github.event.head_commit.message, '#go')
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
          
      - name: Build Tauri app for Mac Intel
        run: npm run tauri build -- --target x86_64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.CLASSIC_ACCESS_TOKEN }}

      # --- LOGGING STEP ---
      - name: List build artifacts for debugging
        if: always() # Runs even if the build fails
        run: |
          echo "Listing all generated bundles:"
          find src-tauri/target/x86_64-apple-darwin/release/bundle -maxdepth 3 -not -path '*/.*'
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ github.sha }}"
          fail_on_unmatched_files: true 
          files: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.CLASSIC_ACCESS_TOKEN }}